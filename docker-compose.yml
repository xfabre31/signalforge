services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - signalforge-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/signalforge.db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  signalforge-data:

